version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: celerlite
      POSTGRES_USER: celerlite
      POSTGRES_PASSWORD: celerlite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U celerlite"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python scripts/run_api.py
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CELERLITE_REDIS_URL: "redis://redis:6379/0"
      CELERLITE_DATABASE_URL: "postgresql+asyncpg://celerlite:celerlite@postgres:5432/celerlite"
      CELERLITE_API_HOST: "0.0.0.0"
      CELERLITE_API_PORT: "8000"
      CELERLITE_LOG_FORMAT: "json"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: python scripts/run_worker.py
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      CELERLITE_REDIS_URL: "redis://redis:6379/0"
      CELERLITE_DATABASE_URL: "postgresql+asyncpg://celerlite:celerlite@postgres:5432/celerlite"
      CELERLITE_WORKER_CONCURRENCY: "4"
      CELERLITE_HEARTBEAT_INTERVAL: "10"
      CELERLITE_HEARTBEAT_TIMEOUT: "30"
      CELERLITE_LOG_FORMAT: "json"
    deploy:
      replicas: 2
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
