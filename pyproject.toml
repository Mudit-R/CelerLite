[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celerlite"
version = "1.0.0"
description = "Production-grade distributed task queue engine"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["celerlite*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
